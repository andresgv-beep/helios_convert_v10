[package]
name = "helios-convert-v10"
version = "0.1.0"
edition = "2021"
description = "HELIOS Native Format v10 container: writer, reader, seal and migration from HNFv9"
authors = ["Andrés García <andres@helios.ai>"]
license = "MIT"

[dependencies]
anyhow = "1.0"
byteorder = "1.5"
clap = { version = "4.4", features = ["derive"] }
crc32fast = "1.3"
half = { version = "2.3", features = ["std"] }
memmap2 = "0.9"
rayon = "1.8"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }

[dev-dependencies]
rand = "0.8"
